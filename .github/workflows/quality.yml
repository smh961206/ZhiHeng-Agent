name: quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: python -m pip install --requirement requirements-dev.lock
      - run: pnpm install --frozen-lockfile
      - run: python -m ruff check python_backend python_tests benchmark
      - run: python -m mypy python_backend benchmark
      - run: python -m pytest --cov=python_backend --cov-report=term-missing python_tests
      - run: python -m benchmark.runner
      - run: pnpm lint
      - run: pnpm api:types:check
      - run: pnpm test
      - run: pnpm test:components
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:routes
      - run: cp .env.production.example .env.production && cp config/models.example.json config/models.production.json && cp config/pricing.example.json config/pricing.production.json
      - run: docker compose -f compose.production.yaml -f compose.models.yaml -f compose.pricing.yaml config --quiet
