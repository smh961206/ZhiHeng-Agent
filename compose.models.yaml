# Production overlay for the schema-v2 model file.
# .env.production provides credentials and runtime controls.
services:
  app:
    environment:
      MODEL_CONFIG_FILE: /app/config/models.production.json
    volumes:
      - type: bind
        source: ./config/models.production.json
        target: /app/config/models.production.json
        read_only: true
        bind:
          create_host_path: false
