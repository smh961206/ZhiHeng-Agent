[project]
name = "zhiheng-agent-backend"
version = "1.0.0"
description = "FastAPI entrypoint for the ZhiHeng investment research system"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.2,<2",
  "httpx>=0.28,<1",
  "longport>=3.0.18,<4",
  "uvicorn[standard]>=0.35,<1",
  "pymongo>=4.11,<5",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
test = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["python_tests"]
asyncio_mode = "auto"
cache_dir = ".pytest-cache-local"
addopts = "--basetemp=.pytest-tmp-local"

[tool.ruff]
target-version = "py311"
line-length = 160

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
exclude = ["python_tests"]

[tool.coverage.run]
branch = true
source = ["python_backend"]

[tool.coverage.report]
fail_under = 70
show_missing = true
